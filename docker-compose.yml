version: '3.9'

services:
  # ── Backend API ────────────────────────────────────────
  backend:
    build: ./backend
    container_name: nyayamitra-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://nyaya:secretpass@postgres:5432/nyayamitra
      - DATABASE_URL_SYNC=postgresql://nyaya:secretpass@postgres:5432/nyayamitra
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
    volumes:
      - chroma_data:/app/data/chroma
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nyayamitra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nyayamitra
      POSTGRES_USER: nyaya
      POSTGRES_PASSWORD: secretpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyaya -d nyayamitra"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend (Nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: nyayamitra-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
